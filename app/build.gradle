plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.programadodzero'
    compileSdk 36

    defaultConfig {
        applicationId 'com.programadodzero'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
}

kotlin {
    jvmToolchain(17)
}
