name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 9.5
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.5-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.5/bin" >> "$GITHUB_PATH"

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: programa-do-zero-debug
          path: app/build/outputs/apk/debug/app-debug.apk
