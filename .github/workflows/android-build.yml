name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: programa-do-zero-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar APK em Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Programa do Zero - Build ${{ github.run_number }}
          body: |
            APK gerado automaticamente a partir da branch main.
            Esta versão é uma build de debug para instalação e testes.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
